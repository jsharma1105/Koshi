name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for SourceLink deterministic builds

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --logger "GitHubActions;summary.includePassedTests=false" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        continue-on-error: true  # Diagnostic artifact; don't fail the build on transient artifact-service errors.
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7
          if-no-files-found: warn

  smoke:
    name: smoke (MCP protocol)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Koshi.slnx --configuration Release
      - name: Run MCP smoke test
        # Exits 0 iff the server responds to initialize + tools/list + ≥1 tools/call.
        # Catches stdio/JSON-RPC regressions that unit tests don't.
        run: dotnet run --project tests/Koshi.Mcp.SmokeTest -c Release --no-build

  pack-smoke:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pack Koshi.Mcp
        run: dotnet pack src/Koshi.Mcp/Koshi.Mcp.csproj -c Release -o nupkg --include-symbols
      - name: Pack Koshi.Agents
        run: dotnet pack src/Koshi.Agents/Koshi.Agents.csproj -c Release -o nupkg --include-symbols
      - name: Upload packages
        continue-on-error: true  # Smoke-test artifact; don't fail the build on transient artifact-service errors.
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/
          retention-days: 7
