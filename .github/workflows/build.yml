name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for SourceLink deterministic builds

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --logger "GitHubActions;summary.includePassedTests=false" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        continue-on-error: true  # Diagnostic artifact; don't fail the build on transient artifact-service errors.
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7
          if-no-files-found: warn

  smoke:
    name: smoke (MCP protocol)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Koshi.slnx --configuration Release
      - name: Run MCP smoke test
        # Exits 0 iff the server responds to initialize + tools/list + ≥1 tools/call.
        # Catches stdio/JSON-RPC regressions that unit tests don't.
        run: dotnet run --project tests/Koshi.Mcp.SmokeTest -c Release --no-build

  pack-smoke:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pack Koshi.Mcp
        run: dotnet pack src/Koshi.Mcp/Koshi.Mcp.csproj -c Release -o nupkg --include-symbols
      - name: Pack Koshi.Agents
        run: dotnet pack src/Koshi.Agents/Koshi.Agents.csproj -c Release -o nupkg --include-symbols
      - name: Upload packages
        continue-on-error: true  # Smoke-test artifact; don't fail the build on transient artifact-service errors.
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/
          retention-days: 7

  aot-smoke:
    name: aot-smoke (linux-x64)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install AOT prerequisites (clang, zlib)
        # .NET Native AOT on Linux requires a C toolchain + zlib headers.
        # ubuntu-latest images already have clang, but zlib1g-dev is not
        # always preinstalled — better safe than sorry.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish Koshi.Mcp as Native AOT (linux-x64)
        # AOT publish stamps the assembly with the version we pass here; the
        # smoke test re-reads it via koshi_version. If the version doesn't
        # round-trip cleanly, the smoke fails and so does this PR gate.
        run: |
          dotnet publish src/Koshi.Mcp/Koshi.Mcp.csproj \
            -c Release -r linux-x64 \
            -p:PublishAot=true \
            -p:Version=0.4.0-aot-smoke \
            -o aot
      - name: Build smoke test harness
        run: dotnet build tests/Koshi.Mcp.SmokeTest -c Release
      - name: Run full smoke against AOT binary
        # Exercises ALL 20 tools + 3 bad-arg paths + version-stamp assertion
        # against the AOT binary directly (no `dotnet` host). Catches any
        # SDK runtime reflection that build-time IL warnings don't surface.
        run: |
          chmod +x ./aot/koshi-mcp
          dotnet run --project tests/Koshi.Mcp.SmokeTest -c Release --no-build -- \
            --exe ./aot/koshi-mcp \
            --expected-version 0.4.0-aot-smoke
      - name: Report AOT binary size
        if: always()
        run: |
          if [ -f ./aot/koshi-mcp ]; then
            ls -lh ./aot/koshi-mcp
            echo "size_bytes=$(stat -c '%s' ./aot/koshi-mcp)" >> $GITHUB_STEP_SUMMARY
          fi
